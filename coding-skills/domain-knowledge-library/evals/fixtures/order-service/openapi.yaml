openapi: 3.1.0
info:
  title: Order Service
  version: 1.0.0
paths:
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order cancelled
        "409":
          description: Order cannot be cancelled in its current state
