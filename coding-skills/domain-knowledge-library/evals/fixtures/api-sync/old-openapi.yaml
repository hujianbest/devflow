openapi: 3.0.3
info:
  title: Order API
  version: 1.4.0
paths:
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      responses:
        "200":
          description: Order cancelled synchronously
  /orders/{orderId}:
    get:
      operationId: getOrder
      responses:
        "200":
          description: Order returned
