schema_version: "1.0"
rules:
  - source_role: implementation
    authority_for: [implemented-structure, implemented-logic]
    not_authority_for: [formal-business-meaning, production-runtime-state]
  - source_role: design-intent
    authority_for: [stated-concept-purpose]
    not_authority_for: [runtime-conformance, human-confirmed-bounded-context]
human_gates:
  bounded-context: required
  ubiquitous-term: required
  business-rule: required
owners:
  billing-accounting: unknown
  identity-access: unknown
